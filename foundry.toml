[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
cache_path = "cache"
solc_version = "0.8.36"
optimizer = true
# LaunchHook sits 223 bytes past the 24,576 byte runtime limit at 2,000 runs after the audit fixes
# of 2026-09-07, and a v4 hook cannot be split behind a proxy because its permissions are the low
# bits of its own address. 1,500 leaves it 799 bytes of headroom. Foundry 1.5.1 will not carry a
# per-contract profile, so this is the whole set.
optimizer_runs = 1_500

evm_version = "cancun"
ffi = false
# The release records are what a deploy writes, one per rail, and the scratch copies beside them
# are how a test proves a deploy writes a record without touching a committed one. The four
# sources below are read-only. Two are read by `contracts/test/StockLinkRegistry.t.sol`, which
# proves the stock link's own source carries no eligibility or jurisdiction vocabulary. The other
# two are read by `contracts/test/DeployWorkSplitScript.t.sol` and
# `contracts/test/DeployDualFillScript.t.sol`, which cannot enter a broadcast context and so read
# the deploy path to pin that the record write is part of it. Without them those cases report as
# skipped, which is a scan that never ran wearing the colour of one that passed. The agent and
# combined Dual Fill deploy scripts are read the same way.
#
# The Dual Fill rehearsals run on 46630 as separate stages, minutes to hours apart, so each keeps
# the fills it created in a state file between runs.
fs_permissions = [
    { access = "read-write", path = "./deployments.json" },
    # `DeployArc.s.sol` only reads the Arc records: it rebuilds the whole rail, so it stages its
    # own file beside the record and ops/arc/deploy.sh moves it into place after the broadcast.
    # The three Dual Fill deploys set one key each and are writable here for the same reason
    # deployments.json is: the write happens only in a broadcast context, and a key left naming a
    # factory a failed broadcast never created has no code, which every guard reads as absent.
    { access = "read-write", path = "./deployments/arc-testnet.json" },
    { access = "read-write", path = "./deployments/arc-mainnet.json" },
    { access = "read-write", path = "./deployments/arc-testnet.pending.json" },
    { access = "read-write", path = "./deployments/arc-mainnet.pending.json" },
    # The bridged Crosscurrent deploy writes one record per network and the wrapper creation code
    # the API hands the registrar, on a broadcast run only.
    { access = "read-write", path = "./deployments/crosscurrent-bridge-robinhood-mainnet.json" },
    { access = "read-write", path = "./deployments/crosscurrent-bridge-robinhood-testnet.json" },
    { access = "read-write", path = "./deployments/crosscurrent-bridge-arc-mainnet.json" },
    { access = "read-write", path = "./deployments/crosscurrent-bridge-arc-testnet.json" },
    { access = "read-write", path = "./deployments/crosscurrent-bridge-creation-code.json" },
    { access = "read-write", path = "./cache/work-split-record.json" },
    { access = "read-write", path = "./cache/dual-fill-record.json" },
    { access = "read-write", path = "./cache/arc-dual-fill-record.json" },
    { access = "read-write", path = "./cache/arc-dual-fill-fork-record.json" },
    { access = "read-write", path = "./cache/arc-linked-dual-fill-record.json" },
    { access = "read-write", path = "./cache/arc-dual-fill-agent-record.json" },
    { access = "read-write", path = "./cache/dual-fill-rehearsal-46630.json" },
    { access = "read-write", path = "./cache/dual-fill-shapes-record.json" },
    { access = "read-write", path = "./cache/linked-dual-fill-record.json" },
    # One scratch record per generation test, because a suite's tests run side by side and two
    # writers on one file read each other's factory.
    { access = "read-write", path = "./cache/dual-fill-generations.json" },
    { access = "read-write", path = "./cache/linked-dual-fill-generations.json" },
    { access = "read-write", path = "./cache/dual-fill-agent-generations.json" },
    { access = "read-write", path = "./cache/dual-fill-shapes-46630.json" },
    { access = "read-write", path = "./cache/quote-fee-rehearsal-46630.json" },
    { access = "read-write", path = "./cache/quote-fee-mistakes-46630.json" },
    { access = "read", path = "./src/StockLinkRegistry.sol" },
    { access = "read", path = "./script/DeployStockLink.s.sol" },
    { access = "read", path = "./script/DeployWorkSplit.s.sol" },
    { access = "read", path = "./script/DeployDualFill.s.sol" },
    { access = "read", path = "./script/DeployDualFillAgent.s.sol" },
    { access = "read", path = "./script/DeployLinkedDualFill.s.sol" },
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[fuzz]
runs = 10_000

[invariant]
runs = 256
depth = 500
fail_on_revert = true

[rpc_endpoints]
rh_mainnet = "https://rpc.mainnet.chain.robinhood.com"
rh_testnet = "https://rpc.testnet.chain.robinhood.com"

# The gas ledger is checked under this profile, on every machine and in CI. `bytecode_hash = "none"`
# is what makes it comparable: with the metadata trailer in place the compiled initcode carries a
# hash of the sources and the compiler settings, which moves the CREATE addresses, and a handful of
# tests are sensitive to address ordering. Measured 2026-09-05: two worktrees with byte-identical sources,
# the same forge and the same libraries reported gas twelve units apart, and agreed exactly with
# the trailer removed. Deploys and verification keep the default profile, so the metadata hash is
# still in the bytecode that reaches the chain and an explorer can still match it in full.
[profile.snapshot]
bytecode_hash = "none"
